[project]
name = "vn-music-network"
version = "0.1.0"
description = "Thu thập và xây dựng mạng lưới ca sĩ, nhạc sĩ, công ty giải trí Việt Nam"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2025.10.22",
    "requests>=2.32",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "neo4j>=5.20",
    "trafilatura>=2.0",
    "playwright>=1.50",
    "networkx>=3.6.1",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "apscheduler>=3.10,<4",
    "matplotlib>=3.9",
]

[tool.uv]
package = false
